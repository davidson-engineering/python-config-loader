[project]
name = "python-config-loader"
description = "A library tool to load and merge configuration files from multiple formats. Allows for parsing of environment variables and dotenv files."

dynamic = ["version"]

readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { email = "matthew@davidson.engineering" },
  { name = "Matthew Davidson" },
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Operating System :: MacOS",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "pyyaml >= 6.0.0",
  "python-dotenv>=1.0.1",
  "tomli >= 2.0.1 ; python_version < '3.11'",
]

[tool.setuptools.dynamic]
version = { attr = "config_loader.__version__" }

[project.optional-dependencies]
test = ["pytest >= 7.1.1"]
